<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cuidador - NutriTeia</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <div class="header-title">NutriTeia</div>
    <div class="header-user"><a href="Login.html" style="color:white; text-decoration:none;">Já tenho conta</a></div>
  </header>

  <div class="main-container">
    <h2 class="section-title">Cadastro de Cuidador / Tutor</h2>

    <div class="card">
        <form action="cadastrar_tutor.php" method="POST">

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" minlength="8" required>
                </div>
            </div>

            <div class="grid-2" style="margin-top: 15px;">
                <button type="button" class="btn" style="background:#888;" onclick="window.location.href='Login.html'">Cancelar</button>
                <button type="submit" class="btn-action">Cadastrar</button>
            </div>
        </form>
    </div>
  </div>

  <script>
    function cadastrarUsuario(e) {
      e.preventDefault();
      const s1 = document.getElementById('senha').value;
      const s2 = document.getElementById('confirmar-senha').value;
      if (s1 !== s2) {
        alert('As senhas não coincidem!');
        return;
      }
      alert('Cadastro realizado com sucesso! Faça login para continuar.');
      window.location.href = 'Login.html';
    }
  </script>
</body>
</html>
